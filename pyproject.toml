[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfinder"
version = "0.1.0"
description = "Browser-driven finder for viral short-form clips worth editing"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
stealth = ["patchright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
clipfinder = "clipfinder.cli:main"

[tool.setuptools]
packages = ["clipfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
